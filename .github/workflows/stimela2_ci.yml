name: Stimela2 countinuous integration

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"] #["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.11"

    - name: Install Apptainer
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.6

    - name: Install gdown
      run: |
        uv pip install  --system  gdown

    - name: Install Caracal runtime
      run: |
        uv pip install --system .

    - name: Download test MS from Google Drive
      run: |
          gdown https://drive.google.com/uc?id=1Hki6i1Hr7Y2IwppnE1i_URHizqF3gtKM
          unzip T16R02C02-corr-scan3-chan512-t16-XXYY.ms.zip
          mkdir -p msdir
          cp -r T16R02C02-corr-scan3-chan512-t16-XXYY.ms msdir/T16R02C02-corr-scan3-chan512-t16-XXYY-T16R02C02.ms
          mv T16R02C02-corr-scan3-chan512-t16-XXYY.ms msdir/

    - name: Run Caracal selfcalx
      run: |
        caracal \
          -c tests/config_selfcalx_ci.yml \
          --general-msdir msdir \
          --general-rawdatadir msdir \
          --general-output caracal-ci-output \
          --getdata-dataid '["T16R02C02-corr-scan3-chan512-t16-XXYY-T16R02C02"]' \
          --obsconf-obsinfo-listobs true \
          -ew obsconf
        caracal \
          -c tests/config_selfcalx_ci.yml \
          --general-msdir msdir \
          --general-rawdatadir msdir \
          --general-output caracal-ci-output \
          --getdata-dataid '["T16R02C02-corr-scan3-chan512-t16-XXYY"]' \
          --obsconf-obsinfo-listobs true \
          -ew obsconf
        caracal \
          -c tests/config_selfcalx_ci.yml \
          -sw selfcalx \
          -ew selfcalx \
          --general-msdir msdir \
          --general-rawdatadir msdir \
          --general-output caracal-ci-output \
          --getdata-dataid '["T16R02C02-corr-scan3-chan512-t16-XXYY"]' \
          --selfcalx-label_in "" \
          --selfcalx-start_iter 0 \
          --selfcalx-cal_niter 0
        caracal \
          -c tests/config_selfcalx_ci.yml \
          -sw selfcalx \
          -ew selfcalx \
          --general-msdir msdir \
          --general-rawdatadir msdir \
          --general-output caracal-ci-output \
          --getdata-dataid '["T16R02C02-corr-scan3-chan512-t16-XXYY"]' \
          --selfcalx-label_in ""

    - name: Remove test MS and run mosaic
      run: |
        rm -rf msdir/T16R02C02-corr-scan3-chan512-t16-XXYY.ms*
        rm -rf caracal-ci-msdir
        rm -rf quay.io-stimela2*
        stimela run ../caracal/caracal/recipes/caracal.yml mosaic-pointings \
          out-image-num=3 \
          dir-out-base=output

    - name: Upload Caracal outputs
      uses: actions/upload-artifact@v4
      with:
        name: caracal-output
        path: |
          output/
          caracal-ci-output/
          *log*
        if-no-files-found: warn
        retention-days: 7
